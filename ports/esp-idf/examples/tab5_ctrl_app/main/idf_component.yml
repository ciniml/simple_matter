## tab5_ctrl_app の managed component 依存(T1b: 表示層を M5GFX へ差し替え済み)。
##
## Espressif BSP(espressif/m5stack_tab5 + esp_lvgl_port)は実機 Tab5
## (board version 2 / ST7123 タッチ)で「初期化ログ正常・バックライト点灯・
## 画面真っ黒」になったため廃止した。docs/design/p4-thread-controller.md §9.5。
##
## m5stack/m5unified が m5stack/m5gfx(>=0.2.27)を引く。M5GFX は Tab5 の
## MIPI-DSI パネル + タッチ(GT911 / ST7123)+ IO エキスパンダ(PORT.A 5V)を
## 自前で面倒見るので、BSP 相当は不要。
##
## LVGL は BSP 経由ではなくなったので直接指定する(ポートは main/display_gfx.cpp)。
##
## WiFi(T2、§10)は基板上の ESP32-C6 を SDIO で使う。esp_wifi_remote が
## 標準 esp_wifi_* API を esp_hosted 経由で C6 へ透過転送する。
## C6 の slave FW は esp_hosted 2.12.7 系に焼き替え済み(工場出荷の V1.4.1 =
## hosted 1.4.x とはプロトコル非互換)なので host も 2.x 系で合わせる。
dependencies:
  idf: ">=5.4"
  m5stack/m5unified: "^0.2.20"
  lvgl/lvgl: "^9.2.0"
  espressif/esp_hosted: "^2.12.7"
  espressif/esp_wifi_remote: "^1.5.1"
