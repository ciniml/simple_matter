[package]
name = "esp32s3-firmware"
version = "0.1.0"
edition = "2021"
license = "BSL-1.0"
publish = false

# M5Stack AirQ(ESP32-S3FN8 / M5StampS3)向けファームウェア。
# lib(no_std の共有部。C6 ポートから移植)+ 複数 bin 構成。
# 依存のバージョン・feature 構成は C6 ポート(ports/esp32/esp32c6-firmware)と
# 同一で、chip feature だけ esp32c6 → esp32s3 に変えている(選定理由・バージョン
# 制約のコメントは C6 側 Cargo.toml を参照)。
[lib]
name = "esp32s3_firmware"

# 段階 1 スモーク(E1 相当: バナー + TRNG + P-256 + heartbeat)。
[[bin]]
name = "esp32s3-firmware"
path = "src/main.rs"

# 段階 2: C6 e5-light の S3 版(BLE+WiFi dual-transport の Dimmable Light。
# AirQ に LED は無いため OnOff/Level はログ出力のみ)。
[[bin]]
name = "s3-light"
path = "src/bin/s3-light.rs"

# 段階 3: AirQ 本番 FW(3 EP 空気質センサ + SEN55/SCD40 実センサ)。
[[bin]]
name = "airq-sensor"
path = "src/bin/airq-sensor.rs"

# K2: S3 スタンドアロンコミッショナ(UDP-only ハブ、docs/design/esp32-controller.md)。
# WiFi join → mDNS ブラウズ(QU + QM フォールバック)→ フルコミッショニング →
# CASE → OnOff Toggle。CA は EspKvs(キー b"cast"、smctl v1 互換)へ永続化。
[[bin]]
name = "s3-controller"
path = "src/bin/s3-controller.rs"

[dependencies]
esp-hal = { version = "1.1.1", features = ["esp32s3", "unstable"] }
esp-println = { version = "0.17.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.19.0", features = [
    "esp32s3",
    "println",
    "panic-handler",
] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }

# コア。デバイス(responder)構成 + controller(s3-controller 用。feature は
# workspace で合成されるが、controller はデバイス bin の flash に波及しないことを
# CI の bloat-check footprint-invariance が機械検証している)。
simple-matter = { path = "../../../crates/simple-matter", default-features = false, features = [
    "rustcrypto",
    "ble",
    "controller",
] }

# --- BLE + Wi-Fi(esp-radio S3 coex + TrouBLE 0.6 + embassy)---
# trouble-host 0.6 固定の理由(bt-hci 0.8 系)は C6 側 Cargo.toml のコメント参照。
esp-radio = { version = "0.18.0", features = [
    "esp32s3",
    "ble",
    "wifi",
    "coex",
    "unstable",
] }
esp-rtos = { version = "0.3.0", features = [
    "esp32s3",
    "embassy",
    "esp-radio",
    "esp-alloc",
] }
# internal-heap-stats: HeapStats::max_usage(ヒープ最高水位)を [alive] ログで
# 監視するため(S3 は DRAM が狭くヒープ/スタック配分がタイトなので常時計測する)。
esp-alloc = { version = "0.10.0", features = ["internal-heap-stats"] }
trouble-host = { version = "0.6.0", default-features = false, features = [
    "peripheral",
    "gatt",
    "derive",
    "default-packet-pool",
] }
bt-hci = "0.8"
embassy-executor = "0.10.0"
embassy-time = "0.5.1"
embassy-futures = "0.1.2"
embassy-sync = "0.7"
heapless = "0.9"
static_cell = "2.1"

# --- fabric 永続化(flash KVS)---
esp-storage = { version = "0.9.0", features = ["esp32s3"] }
sequential-storage = "7.2"
embedded-storage = "0.3"
embedded-storage-async = "0.4"

# --- AirQ 実センサ(SEN55 + SCD40。airq-port.md §2 / sensors.rs の選定メモ)---
# sen5x-rs: SEN55(0x69)。embedded-hal 1.0、no_std。
sen5x-rs = "0.4.0"
# libscd: SCD40(0x62)。sync API + scd4x feature(SCD40/41 共通コマンドのみ)。
libscd = { version = "0.5.1", features = ["sync", "scd4x"] }
# 1 本の I2C バス(SDA=11/SCL=12)を 2 ドライバへ分配する RefCellDevice。
# SPI 側では ExclusiveDevice(CS + delay 付き SpiDevice 化)を e-ink に使う。
embedded-hal-bus = "0.3"

# --- e-ink ディスプレイ(GDEW0154D67 = SSD1681 系 1.54" 200x200。airq-port.md §7.5)---
# epd1in54_v2 モジュールが同一パネル(GDEH0154D67)向け。embedded-hal 1.0 / no_std。
# epd2in13_v3 は未使用だが必須(crate が 2in13 モジュールを無条件コンパイルし
# variant feature の選択を強制するため。dead-code はリンカが落とす)。
epd-waveshare = { version = "0.6.0", default-features = false, features = [
    "graphics",
    "epd2in13_v3",
] }
# 表示描画(テキスト)。epd-waveshare の Display1in54 が DrawTarget を実装する。
embedded-graphics = "0.8"

# --- Wi-Fi 実 join + UDP/mDNS(embassy-net)---
embassy-net = { version = "0.9", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "proto-ipv6",
    "udp",
    "dhcpv4",
    "multicast",
] }
