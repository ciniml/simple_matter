[package]
name = "esp32c6-firmware"
version = "0.1.0"
edition = "2021"
license = "BSL-1.0"
publish = false

# lib(no_std の共有部: EspRng / TroubleGattPeripheral)+ 複数 bin 構成。
# default bin(src/main.rs)= E1 骨格、src/bin/e2-ble.rs = E2 BLE ファームウェア。
[lib]
name = "esp32c6_firmware"

[[bin]]
name = "esp32c6-firmware"
path = "src/main.rs"

[[bin]]
name = "e2-ble"
path = "src/bin/e2-ble.rs"

# E3: BLE(BTP)経由のフルコミッショニング On/Off ライト(MatterStack 統合)。
[[bin]]
name = "e3-ble-light"
path = "src/bin/e3-ble-light.rs"

# E4: E3 + fabric 永続化(flash KVS。リブート後の運用 CASE 再確立)。
[[bin]]
name = "e4-ble-light"
path = "src/bin/e4-ble-light.rs"

[dependencies]
esp-hal = { version = "1.1.1", features = ["esp32c6", "unstable"] }
esp-println = { version = "0.17.0", features = ["esp32c6"] }
esp-backtrace = { version = "0.19.0", features = [
    "esp32c6",
    "println",
    "panic-handler",
] }

# コア。デバイス(responder)向けの最小構成。default-features = false で std を排し、
# rustcrypto(暗号バックエンド)と ble(BTP トランスポート)のみを有効化する。
simple-matter = { path = "../../../crates/simple-matter", default-features = false, features = [
    "rustcrypto",
    "ble",
    "factory-data",
] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c6"] }

# --- E2: BLE(esp-radio BLE controller + TrouBLE host)---
#
# esp-radio 0.18 の `BleConnector` は **bt-hci 0.8** の `Transport` を実装する。
# trouble-host 0.7 は bt-hci **0.9** を要求するため `ExternalController` に
# `BleConnector` を渡せない(trait が別クレートバージョンで別物になる)。
# bt-hci ^0.8 を使う trouble-host の最終版は **0.6.0** なので、それに固定する
# (esp-radio 0.18 の Cargo.lock も bt-hci 0.8.0 のみ)。
esp-radio = { version = "0.18.0", features = [
    "esp32c6",
    "ble",
    # E5: Wi-Fi station(実 join)+ BLE 同時動作(coex)。
    "wifi",
    "coex",
    "unstable",
] }
# esp-radio が要求する preemptive スケジューラ。`embassy` feature が
# embassy-time driver + `#[esp_rtos::main]`(thread-mode executor)を提供する。
esp-rtos = { version = "0.3.0", features = [
    "esp32c6",
    "embassy",
    "esp-radio",
    "esp-alloc",
] }
# esp-radio の内部バッファ・BLE controller タスクはヒープを要求する。
esp-alloc = "0.10.0"
trouble-host = { version = "0.6.0", default-features = false, features = [
    "peripheral",
    "gatt",
    "derive",
    "default-packet-pool",
] }
# BleConnector が実装する HCI Transport / ExternalController(esp-radio と同じ 0.8 系)。
bt-hci = "0.8"
# esp-rtos の executor 統合を使うため arch-* feature は付けない(esp-rtos README)。
embassy-executor = "0.10.0"
embassy-time = "0.5.1"
embassy-futures = "0.1.2"
# trouble-host 0.6 と同じ 0.7 系に合わせる(gatt_server マクロが
# `embassy_sync::blocking_mutex::raw::NoopRawMutex` をこちらのクレート名前空間で参照する)。
embassy-sync = "0.7"
# trouble-host 0.6 の gatt_traits(AsGatt/FromGatt)実装と同じ 0.9 系。
heapless = "0.9"
# gatt_service マクロが characteristic 値の静的ストレージに使う。
static_cell = "2.1"

# --- E4: fabric 永続化(flash KVS、doc §E4.5)---
#
# esp-storage: 内蔵 flash への embedded-storage trait 実装(FlashStorage)。
# sequential-storage: no_std の wear-leveling 付き KV(map)。API は
# embedded-storage-async なので、blocking の FlashStorage を src/kvs.rs の
# 薄いアダプタで持ち上げ、embassy-futures の block_on で駆動する。
esp-storage = { version = "0.9.0", features = ["esp32c6"] }
sequential-storage = "7.2"
embedded-storage = "0.3"
embedded-storage-async = "0.4"

# --- E5: Wi-Fi 実 join + UDP/mDNS(doc §E5.4 / §E5.5)---
#
# embassy-net: esp-radio の `Interface` が embassy-net-driver 0.2 の `Driver` を
# 実装するため、その系列に合う版を使う。IPv4(DHCPv4)+ IPv6 リンクローカル静的設定
# (proto-ipv6、mDNS の ff02::fb 用に MLD = multicast)。コアの
# UdpSend/UdpReceive/UdpMulticast は src/net.rs で実装する
# (docs/design/mdns-ipv6.md §4)。
embassy-net = { version = "0.9", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "proto-ipv6",
    "udp",
    "dhcpv4",
    "multicast",
] }

[[bin]]
# E5: E4 + Wi-Fi 実 join + UDP/mDNS dual-transport(chip-tool `pairing ble-wifi`)。
name = "e5-light"
path = "src/bin/e5-light.rs"
