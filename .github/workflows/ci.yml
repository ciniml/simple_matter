name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: thumbv6m-none-eabi, riscv32imc-unknown-none-elf, thumbv7em-none-eabihf
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test (host)
        run: cargo test --all-features
      # no_std クロスチェックはコアクレートのみ(simple-matter-ble は std/tokio 前提の
      # PC バックエンドなのでワークスペース一括では通らない)。RISC-V は ESP32-C3 移植の
      # 前提ゲート E0(docs/design/port-esp32-device.md §8)。
      - name: Check no_std (Cortex-M0)
        run: cargo check -p simple-matter --all-features --target thumbv6m-none-eabi
      - name: Check no_std (RISC-V / ESP32-C3 gate)
        run: cargo check -p simple-matter --all-features --target riscv32imc-unknown-none-elf
      # controller feature を無効化した最小構成でもビルドが通ること(feature gating の健全性)。
      - name: Check no-default-features
        run: cargo check -p simple-matter --no-default-features
      # フットプリント計測(docs/ARCHITECTURE.md 設計原則 10)。
      - name: Bloat-check RAM report (host)
        run: cargo run -p bloat-check --bin ram-report --release
      - name: Bloat-check flash size (Cortex-M4F)
        run: |
          cargo build -p bloat-check --bin flash-probe --release --target thumbv7em-none-eabihf
          size -A target/thumbv7em-none-eabihf/release/flash-probe
      # controller feature 有効化がデバイス(responder)専用ビルドのフットプリントへ実質的に
      # 影響しないことを機械検証する(docs/design/controller.md §2.3)。feature 構成はシンボル
      # ハッシュや inliner の文脈に影響するため、バイト単位の一致は保証できない(実測で
      # 共有関数のアウトライン判断が数十バイト揺れる)。閾値 128 バイトで「controller の実コードが
      # デバイスパスへ波及した」事故のみを検知する。
      - name: Bloat-check controller-feature footprint invariance
        run: |
          cargo build -p bloat-check --bin flash-probe --release --target thumbv7em-none-eabihf
          BASE=$(size -A target/thumbv7em-none-eabihf/release/flash-probe | awk '/Total/{print $2}')
          cargo build -p bloat-check --bin flash-probe --release --target thumbv7em-none-eabihf --features simple-matter/controller
          CTL=$(size -A target/thumbv7em-none-eabihf/release/flash-probe | awk '/Total/{print $2}')
          DELTA=$(( CTL - BASE )); DELTA=${DELTA#-}
          echo "device build: $BASE B / with controller feature: $CTL B (delta $DELTA B)"
          test "$DELTA" -le 128 && echo "footprint invariant within codegen-noise threshold"

  # コミッショナーの Windows 対応 W0(docs/design/port-windows-commissioner.md §5)。
  # ビルド健全性のみを検証する(BLE 実機テストは手動)。device feature(bluer)は
  # Linux 専用の target 依存なので、Windows では lib から cfg で消える。
  windows-commissioner:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Check simple-matter-ble (all features; bluer is cfg'd out)
        run: cargo check -p simple-matter-ble --all-features
      - name: Check ble-commissioner example
        run: cargo check -p simple-matter-ble --features commissioner --examples
      # UDP コミッショナ example も Windows 対応(W3: QU クエリモード)。
      - name: Check UDP commissioner example
        run: cargo check -p simple-matter --features controller --example commissioner
      - name: Clippy (commissioner)
        run: cargo clippy -p simple-matter-ble --features commissioner -- -D warnings
      # smctl(CLI コントローラ、docs/design/cli-controller.md)。Linux は test ジョブの
      # workspace 一括(--all-features)でビルド/クリッピ済みなので、ここでは Windows
      # ネイティブでの BLE feature 込みビルドを検証する(bluer 非依存の担保)。
      - name: Build smctl (BLE feature)
        run: cargo build -p smctl --features ble
      - name: Clippy smctl (BLE feature)
        run: cargo clippy -p smctl --features ble -- -D warnings
