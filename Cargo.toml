[workspace]
resolver = "2"
members = [
    "crates/simple-matter",
    "crates/simple-matter-cffi",
    "crates/bloat-check",
    "crates/simple-matter-ble",
    "crates/smctl",
    "crates/sm-script-api",
]
# wasm32-unknown-unknown 専用のサンプル(no_std + panic_handler + cdylib)は
# ホストの `cargo test --workspace` / clippy から外す(§9.3 Phase C)。
exclude = [
    "crates/sm-script-api/examples-wasm/momentary-toggle",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSL-1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
