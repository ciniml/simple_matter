[workspace]
resolver = "2"
members = [
    "crates/simple-matter",
    "crates/bloat-check",
    "crates/simple-matter-ble",
    "crates/smctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
