[package]
name = "smweb"
description = "Web controller (HTTP/WebSocket + dashboard) built on smctl / simple-matter"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "smweb"
path = "src/main.rs"

[dependencies]
# 駆動コード(ランナー・状態ストア・クラスタ表・Exec)は smctl ライブラリを再利用する
# (docs/design/web-controller.md §3)。
smctl = { path = "../smctl" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# BLE pairing(W3 で使用)。smctl の feature をそのまま転送する。
ble = ["smctl/ble"]
