# cbindgen 設定(scripts/gen-cffi-header.sh が使う)。
# 生成物 include/simple_matter.h はリポジトリにコミットする方式(CI で差分チェック)。

language = "C"
pragma_once = false
include_guard = "SIMPLE_MATTER_H"
autogen_warning = "/* Generated by scripts/gen-cffi-header.sh (cbindgen). DO NOT EDIT. */"
include_version = false
cpp_compat = true
no_includes = true
sys_includes = ["stdint.h", "stdbool.h", "stddef.h"]
tab_width = 2
style = "type"
documentation = true
documentation_style = "c99"
usize_is_size_t = true

[export]
prefix = ""
# 内部型(exported な extern "C" API からは参照されない)を除外し、
# cbindgen のマングリング警告を抑える。
exclude = [
  "Shim",
  "ShimCell",
  "Owned",
  "Light",
  "EventRing",
  "CKvs",
  "CRng",
  "Backend",
  "Dac",
  "OpCreds",
  "Stack",
  "RustCrypto",
  "TestDacProvider",
  "OpCredsCluster",
  "DefaultStack",
  "MatterStack",
  "FabricTable",
  "RefCell",
  "CustomCluster",
  "PendingRegistry",
  "PendingCell",
  "EndpointReg",
  "Vec",
  # コントローラ C FFI(controller.rs)の内部型(extern "C" 署名から参照されない)。
  "CtrlShim",
  "CtrlOwned",
  "Activity",
  "PendingOp",
  "NodeEntry",
  "TxItem",
  "CtrlBackend",
  "CCreds",
  "CStack",
  "CComm",
  "Ca",
  "Commissioner",
  "ControllerCreds",
  "ControllerStack",
  "ScInitiator",
  "ImClient",
  "MdnsClient",
  "Deque",
  "AtomicPtr",
  # composition モード(compose.rs)の Rust 内部定数・型(C ABI には現れない。§9.1)。
  # クラスタ ID / 容量上限は Matter 仕様と設計 doc 側の定義を使う。
  "MAX_COMPOSED_EPS",
  "MAX_CLUSTERS_PER_EP",
  "MAX_SLOTS",
  "MAX_OPTIONS",
  "MAX_OP_ARGS",
  "RC_NO_CLUSTER",
  "RC_NO_ATTR",
  "RC_TYPE",
  "CL_IDENTIFY",
  "CL_GROUPS",
  "CL_ONOFF",
  "CL_LEVEL",
  "CL_SWITCH",
  "CL_BOOL",
  "CL_LOCK",
  "CL_THERMO",
  "CL_FAN",
  "CL_COLOR",
  "CL_ILLUM",
  "CL_TEMP",
  "CL_PRESS",
  "CL_FLOW",
  "CL_HUM",
  "CL_OCC",
  "CL_DESCRIPTOR",
  "Composed",
  "CompositionSpec",
  "EpSpec",
  "EpEntry",
  "OptSpec",
  "ParseError",
  "Slot",
  "Snap",
]

[parse]
parse_deps = false

[enum]
prefix_with_name = false
rename_variants = "None"
