[package]
name = "simple-matter-cffi"
description = "C ABI shim (staticlib) exposing the simple-matter device stack to C/C++17"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# staticlib: ESP-IDF / Zephyr / host C++ からリンクする .a。
# rlib: 本 crate の #[test](FFI 境界のラウンドトリップ)をワークスペースの
#       `cargo test` で走らせるため。
[lib]
crate-type = ["staticlib", "rlib"]

# デバイス(responder)専用。default-features 無しでコアの alloc を持ち込まない
# (定常パス no-alloc の方針を維持。rustcrypto のみ有効化)。
[dependencies]
simple-matter = { path = "../simple-matter", default-features = false, features = [
    "rustcrypto",
] }
# カスタムクラスタの実行時メタ(attr/cmd 表)を固定容量で保持する(no-alloc)。
heapless = { version = "0.8", default-features = false }

[features]
# BLE(BTP)給餌 API + コントローラ C FFI を既定で有効にする
# (docs/design/c-ffi-shim.md §9・§11)。
default = ["ble", "controller"]
# ホスト向けビルド(ctest の staticlib・cargo test)で std を有効にし、
# std のパニックハンドラ・lang item を使う(docs/design/c-ffi-shim.md §2)。
std = []
# ベアメタル(no_std)ビルド向けに #[panic_handler] を提供する。
# ホストビルドでは使わない(std のハンドラを使う)。
panic-abort = []
# BLE 給餌 API(sm_ble_event / sm_ble_poll / sm_ble_adv_data + WiFi プロビジョンの
# take 方式)。コアの ble feature(BTP + PeerAddr::Ble)を引き込む。無効ビルドでも
# C ヘッダは常時宣言し、各 API は SM_ERR / 0 を返す(後方互換。§9.2)。
ble = ["simple-matter/ble"]
# コントローラ(commissioner)側 C FFI(sm_ctrl_*、F7a、docs/design/c-ffi-shim.md §11)。
# コアの controller feature(ControllerStack / Commissioner / MdnsClient)を引き込む。
# 無効ビルドでは sm_ctrl_* シンボルは出力されない(デバイス専用構成のフットプリント不変)。
controller = ["simple-matter/controller"]
